[package]
name = "bleep-hook"
version = "0.2.1"
edition = "2021"
description = "PreToolUse hook adapter and command lexer for bleep, a gate that stops AI coding agents from leaking private repository names onto public GitHub"
license = "MIT"
repository = "https://github.com/tarotene/bleep"
readme = "README.md"
keywords = ["claude-code", "codex", "github", "hooks", "leak-prevention"]
categories = ["command-line-utilities", "development-tools"]
# `cargo install` が使うのは bin だけなので、Bash 本体・shim・tests・CI の
# 定義は配らない。include を指定すると .gitignore の規則は効かず、Cargo.toml と
# Cargo.lock だけが自動で入る。LICENSE と README.md は書かないと入らない。
# The Cargo Book, "The Manifest Format — The exclude and include fields",
# https://doc.rust-lang.org/cargo/reference/manifest.html (取得 2026-11-28)
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "bleep-hook"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 単語分割(クォート/エスケープの解釈)のみを担う。演算子(&& ; |)による
# セグメント分割は POSIX シェル文法そのものであり shell-words の担当範囲
# 外なので、その部分は自前(src/lex.rs)で持つ(#22 の Bash 修正を直接移植)。
# 149M+ ダウンロード・2018年から継続的にメンテナンスされている事実で選定
# — 詳細は先行例との対比(D6)を参照。
shell-words = "1.1"
# 判定レッジャー(#33)のマッチ語ハッシュ化専用。RustCrypto の中核実装で
# 依存グラフが軽い(乱数生成は自前で /dev/urandom を読み、rand crate は
# 追加しない — 鍵生成はプロセス起動あたり高々1回)。
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
# hook のホットパスで毎 tool call ごとに起動するため、起動コストを抑える。
opt-level = 2
