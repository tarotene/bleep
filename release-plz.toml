[workspace]
# bleep-hook は単一クレート(Cargo workspace ではない)なので、
# rust-repo-governance テンプレートが行う「canonical crate だけがタグを
# 持つ」分割は不要 — [workspace] レベルで直接有効化する。
# git_only は、版を crates.io でなく git tag から決めるモードで、このモードの間は
# `cargo publish` を実行しない("The package will not be published to any cargo
# registry"、release-plz, "Configuration — git_only",
# https://release-plz.dev/docs/config、取得 2026-11-28)。
#
# bleep-hook がまだ crates.io に載っていないので、既定(registry モード)では毎回
# 「nothing to release」になり、tag も GitHub Release も切られない。そのため今は
# git_only にしている。crates.io に出す手順は次の順で、順序を変えない:
#   1. git_only のまま、リリース PR をマージして tag `vX.Y.Z` を切る
#   2. その tag から人が手で `cargo publish` する(新しいクレートは Trusted Publishing で
#      出せず、API token が要る。"new crates can't be published with trusted publishing",
#      release-plz, "Quickstart", https://release-plz.dev/docs/github/quickstart、
#      取得 2026-11-28)
#   3. crates.io の Trusted Publishing に release-plz.yml を登録する
#   4. この git_only の行を消す(registry モードに戻す)
# 4 を 2 より先にすると、tag はあるのに crates.io にその版が無い状態になり、
# release-pr が "not found in the registry, but the git tag … exists" で止まる
# (release-plz の crates/release_plz_core/src/command/update/updater.rs)。
git_only = true
git_release_enable = true
git_tag_enable = true
git_release_name = "v{{ version }}"
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "./CHANGELOG.md"
pr_labels = ["release"]
dependencies_update = false
release_commits = "^(feat|fix|perf|refactor)"

# 見出しの `[X.Y.Z](URL)` は 1 つのリンクにする。URL は release-plz が渡す
# `release_link`(前の版との比較。tag 名は git_tag_name と同じ `v` 付き)を使う。
# URL を直書きして `v` を付けない比較リンクを組むと、tag に当たらず切れていた。
# 各行の PR 番号のリンクはテンプレートでは足さない。squash merge のコミット題名は
# 末尾に `(#N)` を持ち、release-plz の既定の前処理が `([#N](…))` に直すので、
# `commit.remote.pr_number` のリンクを足すと同じリンクが 2 つ並んだ(v0.2.1 のリリース
# PR で確認)。`commit.remote` を使わないので、手元の `release-plz update` に GitHub の
# token も要らない。
[changelog]
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}]\
{% if release_link %}({{ release_link }}){% endif %} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits | filter(attribute="merge_commit", value=false) %}\
- {% if commit.breaking %}**[BREAKING]** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
