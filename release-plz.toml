[workspace]
# publish-guard-hook は単一クレート(Cargo workspace ではない)なので、
# rust-repo-governance テンプレートが行う「canonical crate だけがタグを
# 持つ」分割は不要 — [workspace] レベルで直接有効化する。
git_release_enable = true
git_tag_enable = true
git_release_name = "v{{ version }}"
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "./CHANGELOG.md"
pr_labels = ["release"]
dependencies_update = false
release_commits = "^(feat|fix|perf|refactor)"

[changelog]
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] \
{%- if previous %}\
{%- if previous.version %}\
([`{{ version | trim_start_matches(pat="v") }}`](https://github.com/tarotene/publish-guard/compare/{{ previous.version }}..{{ version }}))\
{% endif %}\
{% endif %} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits | filter(attribute="merge_commit", value=false) %}
- {% if commit.breaking %}**[BREAKING]** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.remote.pr_number %} \
([#{{ commit.remote.pr_number }}](https://github.com/tarotene/publish-guard/pull/{{ commit.remote.pr_number }}))\
{% endif %}
{% endfor %}
{% endfor %}
"""
