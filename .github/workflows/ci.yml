name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          severity: error

      # cmd_scan_bash_command(bleep 本体)が字句解析を
      # bleep-hook に委ねているため(D1)、Bash の selftest 自体が
      # このバイナリを必要とする。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo build (bleep-hook)
        run: cargo build
      - name: export BLEEP_LEX_BIN
        run: echo "BLEEP_LEX_BIN=target/debug/bleep-hook" >> "$GITHUB_ENV"

      - name: selftest (core CLI)
        run: ./bleep selftest

      - name: selftest (hook shim)
        run: ./hooks/bleep.sh --selftest

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # crates.io に出す中身(Cargo.toml の include)が組めて、その中身だけで
      # ビルドが通ること。include の書き漏らし(README・LICENSE・src のファイル)を
      # publish の前に捕まえる。
      - name: cargo package
        run: cargo package --locked

      # Claude Code は plugin.json の version を最優先して更新を判定するので、
      # クレートの版とずれると、プラグインの利用者が古い Bash 本体のままになる。
      # 版は Release-plz のリリース PR が両方そろえる(release-plz.yml)。
      - name: plugin.json の version が Cargo.toml と一致する
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          plugin="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [ "$crate" != "$plugin" ]; then
            echo "::error file=.claude-plugin/plugin.json::version ($plugin) が Cargo.toml の version ($crate) と一致しません"
            exit 1
          fi

  docs:
    name: API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: tarotene/dotfiles/.github/actions/docs-rust@main
        with:
          upload: 'false'

  # 全 job を束ねる集約 job。required status check はこの job だけ。
  # job を追加・削除したら needs: も同期させること。
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [test, rust, docs]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
