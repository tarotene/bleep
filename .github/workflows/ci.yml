name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: error

      # cmd_scan_bash_command(bleep 本体)が字句解析を
      # bleep-hook に委ねているため(D1)、Bash の selftest 自体が
      # このバイナリを必要とする。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (bleep-hook)
        run: cargo build
      - name: export BLEEP_LEX_BIN
        run: echo "BLEEP_LEX_BIN=$PWD/target/debug/bleep-hook" >> "$GITHUB_ENV"

      - name: selftest (core CLI)
        run: ./bleep selftest

      - name: selftest (hook shim)
        run: ./hooks/bleep.sh --selftest

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
