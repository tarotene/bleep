name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: error

      - name: selftest (core CLI)
        run: ./publish-guard selftest

      - name: selftest (Claude plugin adapter)
        run: ./hooks/claude-adapter.sh --selftest
