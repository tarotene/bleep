name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: error

      - name: selftest (core CLI)
        run: ./publish-guard selftest

      - name: selftest (Claude plugin adapter)
        run: ./hooks/claude-adapter.sh --selftest

      - name: selftest (Codex adapter)
        run: ./adapters/codex-adapter.sh --selftest

      - name: selftest (Copilot adapter)
        run: ./adapters/copilot-adapter.sh --selftest

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
