name: Release-plz

# rust-repo-governance skill(tarotene/dotfiles)の release-plz.yml テンプレート
# を単一クレート向けに簡略化したもの(workspace/excluded-crate 分割・
# embedded HAL 向けの bump-excluded ロジックは bleep-hook には
# 存在しないため省略)。GitHub App token を使う理由: release-plz が開く
# リリース PR は既定の GITHUB_TOKEN で作ると他の workflow(pull_request
# トリガーの CI)を再帰的に起動しない制約があるため。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # main への push ごとにリリース PR を開閉する。
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Release-plz PR
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      # Claude Code は .claude-plugin/plugin.json の version を最優先して更新を判定する
      # ("a manifest that pins "version" keeps every user on the cached copy until its
      # author changes the string"、Anthropic, "Plugin loading reference",
      # https://code.claude.com/docs/en/plugins/loading.md、取得 2026-11-28)。一方
      # release-plz は Cargo.toml 以外のファイルの版を書き換えない
      # (release-plz/release-plz#1024、Open)。そこで、リリース PR の branch に、
      # plugin.json の version を PR の版へそろえる commit を足す。
      # release-plz は PR を更新するたびに branch を作り直すので、毎回実行する。
      # 版が同じなら何もしない。ci.yml が、この 2 つの版の一致を検査する。
      #
      # commit は git push でなく、Contents API で作る。このリポジトリの Quality
      # Ruleset は署名された commit を求め、リリース PR に署名の無い commit が 1 つでも
      # あると、マージ画面が "Commits must have verified signatures" で止まる
      # (2026-11-28、git push で足した commit が `unsigned` でマージできなかった)。
      # API で作った commit は GitHub が署名する(release-plz 自身の commit も同じ)。
      # App の token を使うので、PR の CI も起動する。
      - name: Sync the plugin.json version into the release PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number // empty' <<< "$PR")"
          if [ -z "$pr_number" ]; then
            echo "no release PR in this run"
            exit 0
          fi
          version="$(jq -r '.releases[0].version' <<< "$PR")"
          branch="$(gh pr view "$pr_number" --json headRefName --jq '.headRefName')"
          path=".claude-plugin/plugin.json"
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch")"
          jq -r '.content' <<< "$current" | base64 -d > "$RUNNER_TEMP/plugin.current.json"
          jq --arg v "$version" '.version = $v' "$RUNNER_TEMP/plugin.current.json" > "$RUNNER_TEMP/plugin.json"
          if cmp -s "$RUNNER_TEMP/plugin.current.json" "$RUNNER_TEMP/plugin.json"; then
            echo "plugin.json is already at $version"
            exit 0
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="chore: sync the plugin version to $version" \
            -f branch="$branch" \
            -f sha="$(jq -r '.sha' <<< "$current")" \
            -f content="$(base64 -w0 "$RUNNER_TEMP/plugin.json")"

  # リリース PR がマージされたら GitHub Release + git tag を作り、
  # crates.io へ publish する(OIDC Trusted Publishing、id-token: write)。
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write # crates.io への OIDC Trusted Publishing に必要
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Release-plz release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
